name: Website Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: node scripts/install-website.mjs

      - name: Build website
        run: npm run build --workspace=./website
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
